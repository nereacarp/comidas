name: comidas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: comidas
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: comidas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comidas -d comidas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://comidas:${DB_PASSWORD}@db:5432/comidas
      JWT_SECRET: ${JWT_SECRET}
      PORT: "3001"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_CREDENTIALS_JSON: ${ADMIN_CREDENTIALS_JSON:-}
      PUBLIC_REGISTRATION: ${PUBLIC_REGISTRATION:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
      target: builder
    restart: "no"
    logging: *default-logging
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://comidas:${DB_PASSWORD}@db:5432/comidas
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_LEGAL_OPERATOR: ${LEGAL_OPERATOR:?LEGAL_OPERATOR es obligatorio}
        VITE_LEGAL_CONTACT: ${LEGAL_CONTACT:?LEGAL_CONTACT es obligatorio}
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  backoffice:
    build:
      context: ../backoffice
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /admin-api
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
