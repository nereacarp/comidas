name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend, backoffice]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm db:generate
        if: matrix.app == 'backend'
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm knip
      - run: pnpm lint
        if: matrix.app != 'backend'

  containers:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile.prod backend
      - run: >-
          docker build -f frontend/Dockerfile.prod
          --build-arg VITE_API_URL=/api
          --build-arg VITE_LEGAL_OPERATOR="CI test operator"
          --build-arg VITE_LEGAL_CONTACT=privacy@example.com
          frontend
      - run: docker build -f backoffice/Dockerfile.prod --build-arg VITE_API_URL=http://localhost:3001 backoffice
